services:
  C2:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - .volumes/kafka:/var/lib/kafka/data

  C3:
    build:
      context: ./data-enricher
    image: data-enricher
    container_name: data-enricher
    depends_on:
      C2:
        condition: service_started
        restart: true
      C4:
        condition: service_started
        restart: true
    restart: unless-stopped
    network_mode: "host"
    environment:
      KAFKA_BROKERS: localhost:9092
      KAFKA_IN_TOPIC: raw.data.v1
      KAFKA_OUT_TOPIC: classified.data.v1

      BATCH_SIZE: 10
      BATCH_TIMEOUT: 500

      API_URL: http://localhost:8080/classify

  C4:
    build:
      context: ./mitre-detector
    image: mitre-detector
    container_name: mitre-detector
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MODEL_PATH: /models
      DATA_PATH: /data/processed
    volumes:
      - ./mitre-detector/models:/models:ro
      - ./mitre-detector/data:/data:ro

  C5:
    build:
      context: ./data-modeler
    image: data-modeler
    container_name: data-modeler
    depends_on:
      C2:
        condition: service_started
        restart: true
      C6:
        condition: service_started
        restart: true
    restart: unless-stopped
    network_mode: "host"
    environment:
      KAFKA_BROKERS: localhost:9092
      KAFKA_TOPIC: classified.data.v1

      BATCH_SIZE: 10
      BATCH_TIMEOUT: 500

      DB_URL: neo4j://localhost:7687
      DB_USER: ""
      DB_PASS: ""

  C6:
    image: neo4j:2026.05-community-trixie
    container_name: neo4j
    ports:
        - "7474:7474" #Browser
        - "7687:7687" #Bolt
    environment:
      NEO4J_AUTH: none

      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G

      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
    volumes:
      - .volumes/neo4j/data:/data
      - .volumes/neo4j/logs:/logs
